# Gripper Controller Configuration for Agilex Piper Gripper
# This file configures the gripper action controller for the Agilex Piper gripper

agilex_piper_gripper_action_controller:
  ros__parameters:
    # Gripper action controller maps single gripper command to two joints
    joint: joint7  # Main gripper joint (GripperActionController uses single joint)

    # The hardware interface will handle the coordination between joint7 and joint8
    # based on the gripper position and effort commands from the action

    # Action interface configuration
    action_monitor_rate: 20.0          # Hz
    goal_tolerance: 0.001              # meters
    max_effort: 10.0                   # N⋅m

    # Allow effort control
    allow_stalling: true
    stall_velocity_threshold: 0.001    # rad/s
    stall_timeout: 1.0                 # seconds
